<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: white;
        }

        nav ul {
            list-style: none;


        }

        .hero ul {
            display: flex;
            justify-self: right;
            margin: 15px;
            margin-right: 250px;

        }

        .hero ul li {
            padding: 20px;
        }

        .most {
            margin-right: 400px;
            font-size: 27px;
            font-weight: 1000;
            background-color: black;
            border-radius: 8px;
            color: yellow;
            height: 28px;
            width: 35px;

        }

        .most .rom {
            padding-left: 25px;
            color: black;
        }

        .most .rom pre {
            padding-left: 70px;
            font-size: 12px;
        }

        .if .was {
            display: flex;
            justify-content: center;
            margin-top: 80px;
            font-size: 45px;
            margin-right: 50px;
        }

        .was img {
            padding-top: 10px;
        }

        .were {
            display: flex;

            margin-top: 45px;
            font-size: 23px;

            width: 850px;
            justify-self: center;
            margin-right: 50px;
        }

        .in {
            font-size: 23px;
            display: flex;
            justify-self: center;
            margin-right: 60px;

        }

        .ed {
            display: flex;
            justify-self: center;
            margin-top: 30px;
            margin-right: 40px;
            background-color: rgba(33, 153, 166, 0.838);
            color: white;
            font-weight: bold;
            padding: 15px;
            border-radius: 7px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;

        }

        ul li {
            cursor: pointer;
            transition: red;
        }

        .link:hover {
            color: white;
            background-color: black;
            border-radius: 3px;

        }

        .ed:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.681);
        }
    </style>
</head>

<body>
    <header>
        <nav class="hero">


            <ul>
                <li class="most">UE<a class="rom">UltraEdit
                        <pre>An idra, Inc. Company</pre>
                    </a>
                </li>

                <li><a class="link
        " href="#">Products<sup>⌄</sup></a> </li>
                <li><a class="link
        " href="#">Pricing <sup>⌄</sup></a></li>
                <li><a class="link
        " href="#">Resources <sup>⌄</sup></a></li>
                <li><a class="link
        " href="#">About us <sup>⌄</sup></a></li>
                <li><img src="Screenshot 2025-08-22 162429.png" height="20px" width="20px" alt=""></li>

            </ul>
        </nav>

    </header>
    <main>
        <div class="if">
            <div class="was">Download&ensp;<b>UltraEdit</b>&ensp;for Windows <img src="photo.png" alt="" height="30px">
            </div>
        </div>
        <div class="were">Download and try UltraEdit before you buy it! This download includes the full Windows</div>
        <div class="in"> version of the text editor</div>
        <div class="ed">DOWNLOAD MAC OR LINUX VERSION</div>

    </main>
</body>

</html>
